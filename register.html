<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nardos Tutoring - Student Registration</title>

    <link rel="stylesheet" href="register.css">
</head>

<body>

    <div class="container">

        <h1>Nardos Tutoring</h1>

        <section id="registrationSection">

            <h2>Student Registration</h2>

            <!-- STUDENT NAME -->
            <div class="form-group">
                <label for="studentName">Student Name</label>

                <input
                    type="text"
                    id="studentName"
                    placeholder="Enter student name"
                    autocomplete="name"
                    required
                >
            </div>

            <!-- PARENT PHONE -->
            <div class="form-group">
                <label for="parentPhone">Parent Phone Number</label>

                <input
                    type="tel"
                    id="parentPhone"
                    placeholder="Enter parent phone number"
                    autocomplete="tel"
                    required
                >
            </div>

            <!-- GRADE -->
            <div class="form-group">
                <label for="studentGrade">Grade</label>

                <select id="studentGrade" required>
                    <option value="">Select Grade</option>
                    <option value="Pre-K">Pre-K</option>
                    <option value="Kindergarten">Kindergarten</option>
                    <option value="1st Grade">1st Grade</option>
                    <option value="2nd Grade">2nd Grade</option>
                    <option value="3rd Grade">3rd Grade</option>
                    <option value="4th Grade">4th Grade</option>
                    <option value="5th Grade">5th Grade</option>
                    <option value="6th Grade">6th Grade</option>
                    <option value="7th Grade">7th Grade</option>
                    <option value="8th Grade">8th Grade</option>
                    <option value="9th Grade">9th Grade</option>
                    <option value="10th Grade">10th Grade</option>
                    <option value="11th Grade">11th Grade</option>
                    <option value="12th Grade">12th Grade</option>
                    <option value="College">College</option>
                </select>
            </div>

            <!-- ATTENDANCE DAYS -->
            <div class="form-group">
                <label>Attendance Days</label>

                <p class="field-description">
                    Select all days the student will attend.
                </p>

                <div class="days-grid">

                    <label class="day-option">
                        <input type="checkbox" name="attendanceDay" value="Monday">
                        Monday
                    </label>

                    <label class="day-option">
                        <input type="checkbox" name="attendanceDay" value="Tuesday">
                        Tuesday
                    </label>

                    <label class="day-option">
                        <input type="checkbox" name="attendanceDay" value="Wednesday">
                        Wednesday
                    </label>

                    <label class="day-option">
                        <input type="checkbox" name="attendanceDay" value="Thursday">
                        Thursday
                    </label>

                    <label class="day-option">
                        <input type="checkbox" name="attendanceDay" value="Friday">
                        Friday
                    </label>

                    <label class="day-option">
                        <input type="checkbox" name="attendanceDay" value="Saturday">
                        Saturday
                    </label>
</div>
            </div>

            <!-- ATTENDANCE TIME -->
            <div class="form-group">
                <label for="startTime">Start Time</label>

                <input
                    type="time"
                    id="startTime"
                    required
                >
            </div>

            <div class="form-group">
                <label for="endTime">End Time</label>

                <input
                    type="time"
                    id="endTime"
                    required
                >
            </div>

            <!-- REGISTER BUTTON -->
            <button id="saveButton" type="button">
                Register Student
            </button>

            <div id="message" role="status" aria-live="polite"></div>

        </section>

    </div>

    <!-- FIREBASE -->
    <script type="module">

       import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";

import {
    getFirestore,
    collection,
    getDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";


        // FIREBASE CONFIGURATION

        const firebaseConfig = {
    apiKey: "AIzaSyD5DlfgTwgbohbj4fpqQdXzuox63P6GJQA",
    authDomain: "saturdaychurchschool.firebaseapp.com",
    projectId: "saturdaychurchschool",
    storageBucket: "saturdaychurchschool.firebasestorage.app",
    messagingSenderId: "1098070001648",
    appId: "1:1098070001648:web:ce1e14aea3c7a374853f35",
    measurementId: "G-QGES69P8QR"
};


        // INITIALIZE FIREBASE

  const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const studentsCollection = collection(db, "students");

// Check the administrator's Firebase login session
let currentUser = null;

onAuthStateChanged(auth, (user) => {
    currentUser = user;

    console.log("Firebase project:", app.options.projectId);
    console.log("Signed-in user:", user ? "Signed in" : "Not signed in");
    console.log("Signed-in UID:", user?.uid || "No UID");
});


        // PAGE ELEMENTS

        const studentNameInput = document.getElementById("studentName");
        const parentPhoneInput = document.getElementById("parentPhone");
        const studentGradeInput = document.getElementById("studentGrade");
        const startTimeInput = document.getElementById("startTime");
        const endTimeInput = document.getElementById("endTime");
        const saveButton = document.getElementById("saveButton");
        const message = document.getElementById("message");


        // REGISTER STUDENT

        saveButton.addEventListener("click", async () => {
if (!currentUser) {
    message.textContent =
        "You are not signed in. Please sign in through the administrator page first.";
    return;
}
            const name = studentNameInput.value.trim();
            const parentPhone = parentPhoneInput.value.trim();
            const grade = studentGradeInput.value;
            const startTime = startTimeInput.value;
            const endTime = endTimeInput.value;

            const attendanceDays = Array.from(
                document.querySelectorAll(
                    'input[name="attendanceDay"]:checked'
                )
            ).map(checkbox => checkbox.value);


            // VALIDATE REQUIRED FIELDS

            if (
                !name ||
                !parentPhone ||
                !grade ||
                attendanceDays.length === 0 ||
                !startTime ||
                !endTime
            ) {

                message.textContent =
                    "Please complete all fields and select at least one attendance day.";

                return;
            }


            // VALIDATE TIME

            if (endTime <= startTime) {

                message.textContent =
                    "End time must be later than start time.";

                return;
            }


            // PREVENT DUPLICATE SUBMISSIONS

            saveButton.disabled = true;
            saveButton.textContent = "Registering...";
            message.textContent = "";


            try {

                // SAVE STUDENT TO FIRESTORE
const studentsCollection = collection(db, "registration");
                const studentDoc = doc(studentsCollection, name.trim());
                await setDoc(studentDoc, {
                    name: name,
                    parentPhone: parentPhone,
                    grade: grade,
                    attendanceDays: attendanceDays,
                    startTime: startTime,
                    endTime: endTime,
                    registeredAt: serverTimestamp()

                });


                // SUCCESS MESSAGE

                message.textContent =
                    "Student registered successfully!";


                // CLEAR FORM

                studentNameInput.value = "";
                parentPhoneInput.value = "";
                studentGradeInput.value = "";
                startTimeInput.value = "";
                endTimeInput.value = "";

                document.querySelectorAll(
                    'input[name="attendanceDay"]'
                ).forEach(checkbox => {
                    checkbox.checked = false;
                });


            }catch (error) { 
                console.error("Registration error:", error);
                message.textContent = 
                    "Registration failed: " + 
                    (error.code || "unknown-error") + 
                    " — " + error.message; 
            } finally { 
                saveButton.disabled = false; 
                saveButton.textContent = "Register Student"; 
            } 
        });
    </script>

</body>
</html>
