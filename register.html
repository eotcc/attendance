<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Registration</title>

    <link rel="stylesheet" href="register.css">
</head>

<body>

    <div class="container">

        <h1>Student Registration</h1>

        <div class="form-group">
            <label for="studentName">Student Name</label>
            <input
                type="text"
                id="studentName"
                placeholder="Enter student name"
            >
        </div>

        <div class="form-group">
            <label for="parentPhone">Parent Phone Number</label>
            <input
                type="tel"
                id="parentPhone"
                placeholder="Enter parent phone number"
            >
        </div>

        <div class="form-group">
            <label for="studentGrade">Grade</label>

            <select id="studentGrade">
                <option value="">Select Grade</option>
                <option value="Pre-K">Pre-K</option>
                <option value="Kindergarten">Kindergarten</option>
                <option value="1st Grade">1st Grade</option>
                <option value="2nd Grade">2nd Grade</option>
                <option value="3rd Grade">3rd Grade</option>
                <option value="4th Grade">4th Grade</option>
                <option value="5th Grade">5th Grade</option>
                <option value="6th Grade">6th Grade</option>
                <option value="7th Grade">7th Grade</option>
                <option value="8th Grade">8th Grade</option>
                <option value="9th Grade">9th Grade</option>
                <option value="10th Grade">10th Grade</option>
                <option value="11th Grade">11th Grade</option>
                <option value="12th Grade">12th Grade</option>
                <option value="College">College</option>
            </select>
        </div>

        <button id="saveButton">
            Register Student
        </button>

        <div id="message"></div>

    </div>


    <script type="module">

        import { initializeApp } from
        "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";

        import {
            getFirestore,
            collection,
            addDoc,
            serverTimestamp
        } from
        "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";


        // FIREBASE CONFIG

        const firebaseConfig = {
            apiKey: "AIzaSyD5DlfgTwgbohbj4fpqQdXzuox63P6GJQA",
            authDomain: "saturdaychurchschool.firebaseapp.com",
            projectId: "saturdaychurchschool",
            storageBucket: "saturdaychurchschool.firebasestorage.app",
            messagingSenderId: "1098070001648",
            appId: "1:1098070001648:web:3c27a2115eab6337853f35",
            measurementId: "G-G86K42XCE4"
        };


        // START FIREBASE

        const app = initializeApp(firebaseConfig);

        const db = getFirestore(app);

        const studentsCollection =
            collection(db, "students");


        // REGISTER STUDENT

        document.getElementById("saveButton")
            .addEventListener("click", async function () {

                const name =
                    document.getElementById("studentName")
                        .value.trim();

                const parentPhone =
                    document.getElementById("parentPhone")
                        .value.trim();

                const grade =
                    document.getElementById("studentGrade")
                        .value;


                // CHECK REQUIRED FIELDS

                if (!name || !parentPhone || !grade) {

                    showMessage(
                        "Please complete all fields."
                    );

                    return;
                }


                try {

                    await addDoc(
                        studentsCollection,
                        {
                            name: name,
                            parentPhone: parentPhone,
                            grade: grade,
                            registeredAt: serverTimestamp()
                        }
                    );


                    showMessage(
                        "Student registered successfully."
                    );


                    // CLEAR FORM

                    document.getElementById("studentName")
                        .value = "";

                    document.getElementById("parentPhone")
                        .value = "";

                    document.getElementById("studentGrade")
                        .value = "";


                } catch (error) {

                    console.error(error);

                    showMessage(
                        "Error registering student: " +
                        error.message
                    );

                }

            });


        function showMessage(message) {

            document.getElementById("message")
                .textContent = message;

        }

    </script>

</body>

</html>
