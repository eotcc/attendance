<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nardos Tutoring - Student Registration</title>

    <link rel="stylesheet" href="register.css">
</head>

<body>

    <div class="container">

        <h1>Nardos Tutoring</h1>

        <!-- STUDENT REGISTRATION SECTION -->
        <section id="registrationSection">

            <h2>Student Registration</h2>

            <div class="form-group">
                <label for="studentName">Student Name</label>

                <input
                    type="text"
                    id="studentName"
                    placeholder="Enter student name"
                    autocomplete="name"
                    required
                >
            </div>

            <div class="form-group">
                <label for="parentPhone">Parent Phone Number</label>

                <input
                    type="tel"
                    id="parentPhone"
                    placeholder="Enter parent phone number"
                    autocomplete="tel"
                    required
                >
            </div>

            <div class="form-group">
                <label for="studentGrade">Grade</label>

                <select id="studentGrade" required>
                    <option value="">Select Grade</option>
                    <option value="Pre-K">Pre-K</option>
                    <option value="Kindergarten">Kindergarten</option>
                    <option value="1st Grade">1st Grade</option>
                    <option value="2nd Grade">2nd Grade</option>
                    <option value="3rd Grade">3rd Grade</option>
                    <option value="4th Grade">4th Grade</option>
                    <option value="5th Grade">5th Grade</option>
                    <option value="6th Grade">6th Grade</option>
                    <option value="7th Grade">7th Grade</option>
                    <option value="8th Grade">8th Grade</option>
                    <option value="9th Grade">9th Grade</option>
                    <option value="10th Grade">10th Grade</option>
                    <option value="11th Grade">11th Grade</option>
                    <option value="12th Grade">12th Grade</option>
                    <option value="College">College</option>
                </select>
            </div>

            <button id="saveButton" type="button">
                Register Student
            </button>

            <div id="message" role="status" aria-live="polite"></div>

        </section>

    </div>


    <!-- FIREBASE FIRESTORE -->
    <script type="module">

        import {
            initializeApp
        } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";

        import {
            getFirestore,
            collection,
            addDoc,
            serverTimestamp
        } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";


        // FIREBASE CONFIGURATION

        const firebaseConfig = {
            apiKey: "AIzaSyCNckYTvnmafHNGZ5my_nkBJ5ZDcujFXtE",
            authDomain: "tutoring-ee569.firebaseapp.com",
            projectId: "tutoring-ee569",
            storageBucket: "tutoring-ee569.firebasestorage.app",
            messagingSenderId: "658435175936",
            appId: "1:658435175936:web:b226b97d80219f8092cae5",
            measurementId: "G-V9YFENGXP2"
        };


        // INITIALIZE FIREBASE

        const app = initializeApp(firebaseConfig);

        const db = getFirestore(app);

        const studentsCollection = collection(db, "students");


        // PAGE ELEMENTS

        const studentNameInput =
            document.getElementById("studentName");

        const parentPhoneInput =
            document.getElementById("parentPhone");

        const studentGradeInput =
            document.getElementById("studentGrade");

        const saveButton =
            document.getElementById("saveButton");

        const message =
            document.getElementById("message");


        // REGISTER STUDENT

        saveButton.addEventListener("click", async () => {

            const name = studentNameInput.value.trim();

            const parentPhone = parentPhoneInput.value.trim();

            const grade = studentGradeInput.value;


            // VALIDATE REQUIRED FIELDS

            if (!name || !parentPhone || !grade) {

                message.textContent =
                    "Please complete all fields.";

                return;

            }


            // PREVENT DUPLICATE SUBMISSIONS

            saveButton.disabled = true;

            saveButton.textContent = "Registering...";

            message.textContent = "";


            try {

                // SAVE STUDENT TO FIRESTORE

                await addDoc(studentsCollection, {

                    name: name,

                    parentPhone: parentPhone,

                    grade: grade,

                    registeredAt: serverTimestamp()

                });


                // SUCCESS MESSAGE

                message.textContent =
                    "Student registered successfully!";


                // CLEAR THE FORM

                studentNameInput.value = "";

                parentPhoneInput.value = "";

                studentGradeInput.value = "";


            } catch (error) {

                console.error(
                    "Student registration error:",
                    error
                );

                message.textContent =
                    "Registration failed. " +
                    "Please check your internet connection " +
                    "and Firestore security rules.";

            } finally {

                saveButton.disabled = false;

                saveButton.textContent = "Register Student";

            }

        });

    </script>

</body>

</html>
