```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registered Students</title>
</head>

<body>

    <h1>Nardos Tutoring - Registered Students</h1>

    <button id="refreshButton" type="button">Refresh List</button>

    <p id="studentCount">Loading students...</p>
    <p id="statusMessage">Connecting to Firebase...</p>

    <table border="1">
        <thead>
            <tr>
                <th>Student Name</th>
                <th>Grade</th>
                <th>Parent Phone</th>
                <th>Attendance Days</th>
                <th>Start Time</th>
                <th>End Time</th>
                <th>Registration Date</th>
            </tr>
        </thead>

        <tbody id="studentList"></tbody>
    </table>

    <script type="module">
        import { initializeApp } from
            "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";

        import {
            getFirestore,
            collection,
            getDocs
        } from
            "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD5DlfgTwgbohbj4fpqQdXzuox63P6GJQA",
            authDomain: "saturdaychurchschool.firebaseapp.com",
            projectId: "saturdaychurchschool",
            storageBucket: "saturdaychurchschool.firebasestorage.app",
            messagingSenderId: "1098070001648",
            appId: "1:1098070001648:web:ce1e14aea3c7a374853f35",
            measurementId: "G-QGES69P8QR"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const studentList = document.getElementById("studentList");
        const studentCount = document.getElementById("studentCount");
        const statusMessage = document.getElementById("statusMessage");

        async function loadStudents() {
            studentList.replaceChildren();
            statusMessage.textContent = "Loading registrations...";
            studentCount.textContent = "Loading students...";

            try {
                const snapshot = await getDocs(
                    collection(db, "registration")
                );

                if (snapshot.empty) {
                    studentCount.textContent = "0 students";
                    statusMessage.textContent =
                        "No registrations found.";
                    return;
                }

                snapshot.forEach((documentSnapshot) => {
                    const student = documentSnapshot.data();
                    const row = document.createElement("tr");

                    const days = Array.isArray(student.attendanceDays)
                        ? student.attendanceDays.join(", ")
                        : "";

                    let registeredDate = "";

                    if (
                        student.registeredAt &&
                        typeof student.registeredAt.toDate === "function"
                    ) {
                        registeredDate =
                            student.registeredAt.toDate().toLocaleDateString();
                    }

                    const values = [
                        student.name,
                        student.grade,
                        student.parentPhone,
                        days,
                        student.startTime,
                        student.endTime,
                        registeredDate
                    ];

                    values.forEach((value) => {
                        const cell = document.createElement("td");
                        cell.textContent = value ?? "";
                        row.appendChild(cell);
                    });

                    studentList.appendChild(row);
                });

                studentCount.textContent =
                    snapshot.size + " registered student(s)";

                statusMessage.textContent =
                    "Registrations loaded successfully.";

            } catch (error) {
                console.error("Firebase error:", error);

                studentCount.textContent = "Unable to load students";
                statusMessage.textContent =
                    "Error: " + error.code + " — " + error.message;
            }
        }

        document.getElementById("refreshButton")
            .addEventListener("click", loadStudents);

        loadStudents();
    </script>

</body>
</html>
```
