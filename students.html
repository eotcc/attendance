<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Directory</title>
  <link rel="stylesheet" href="students.css">
</head>
<body>

  <div class="auth-container">
    <div class="auth-card">
      <div class="card-header">
        <div class="roster-header-row">
          <h2>Student Roster</h2>
          <span class="badge" id="studentCount">0 Active</span>
        </div>
        <p>List of registered students fetched from Firebase</p>
      </div>

      <div id="studentContainer" class="roster-list">
        <div class="empty-state">Loading students...</div>
      </div>

      <div class="card-footer">
        <a href="#" class="link-muted">Directory Management v1.0</a>
      </div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
