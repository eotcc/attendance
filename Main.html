<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Sign In</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="auth-container">
    
    <div class="auth-card">
      <div class="card-header text-center">
        <h2>Student Sign In</h2>
        <p>Enter your Student ID Code to log in.</p>
      </div>

      <form class="auth-form" id="signInForm">
        <div class="form-group">
          <label for="student-id">Student ID Code</label>
          <input 
            type="text" 
            id="student-id" 
            placeholder="e.g. STU-8921" 
            autocomplete="off"
            required 
            autofocus
          />
        </div>

        <button type="submit" class="btn btn-primary">Sign In</button>
      </form>

      <!-- Feedback message shown briefly on sign in -->
      <div id="statusMessage" class="status-message hidden"></div>
      
      <div class="card-footer">
        <a href="admin.html" target="_blank" class="link-muted">View Signed-In Students Roster →</a>
      </div>
    </div>

  </div>

  <script>
    const signInForm = document.getElementById('signInForm');
    const studentIdInput = document.getElementById('student-id');
    const statusMessage = document.getElementById('statusMessage');

    signInForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const idCode = studentIdInput.value.trim().toUpperCase();

      if (!idCode) return;

      // Read current active students from localStorage
      let activeStudents = JSON.parse(localStorage.getItem('activeStudents')) || [];

      // Check if already signed in
      const alreadySignedIn = activeStudents.some(s => s.idCode === idCode);
      if (alreadySignedIn) {
        showMessage(`ID ${idCode} is already signed in!`, 'error');
        return;
      }

      // Add new student entry
      const newStudent = {
        idCode: idCode,
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      };

      activeStudents.unshift(newStudent);
      
      // Save back to localStorage
      localStorage.setItem('activeStudents', JSON.stringify(activeStudents));

      // Show temporary confirmation message
      showMessage(`✓ Welcome! ID ${idCode} signed in successfully.`, 'success');

      // Clear input form for next student
      signInForm.reset();
      studentIdInput.focus();
    });

    function showMessage(msg, type) {
      statusMessage.textContent = msg;
      statusMessage.className = `status-message ${type}`;
      
      // Hide message after 3 seconds
      setTimeout(() => {
        statusMessage.className = 'status-message hidden';
      }, 3000);
    }
  </script>
</body>
</html>
