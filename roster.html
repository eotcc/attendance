<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin - Attendance Roster</title>
  <link rel="stylesheet" href="roster.css" />
</head>
<body>

  <div class="roster-container">
    <div class="roster-card">
      
      <!-- Header with Live Clock & Navigation -->
      <div class="roster-header">
        <div>
          <h2>Live Attendance Roster</h2>
          <div id="liveClock" class="live-clock">Loading time...</div>
        </div>
        <button class="nav-btn" onclick="window.location.href='daysattend.html'">
          Students
        </button>
      </div>

      <!-- Real-Time Check-In Table -->
      <div style="overflow-x: auto;">
        <table>
          <thead>
            <tr>
              <th>Student ID</th>
              <th>Name</th>
              <th>Time</th>
              <th>Date</th>
              <th>Time Remaining</th>
            </tr>
          </thead>
          <tbody id="rosterTableBody">
            <tr>
              <td colspan="4" class="empty-state">Loading attendance logs...</td>
            </tr>
          </tbody>
        </table>
      </div>

    </div>
  </div>

  <!-- Live Clock Script -->
  <script>
    function updateClock() {
      const now = new Date();
      const timeString = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      const dateString = now.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
      document.getElementById('liveClock').textContent = `${dateString} | ${timeString}`;
    }
    setInterval(updateClock, 1000);
    updateClock();
  </script>

  <!-- Firebase Modular Web SDK -->
  <script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";

import {
  getFirestore,
  collection,
  query,
  orderBy,
  onSnapshot
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyD5DlfgTwgbohbj4fpqQdXzuox63P6GJQA",
  authDomain: "saturdaychurchschool.firebaseapp.com",
  projectId: "saturdaychurchschool",
  storageBucket: "saturdaychurchschool.firebasestorage.app",
  messagingSenderId: "1098070001648",
  appId: "1:1098070001648:web:3c27a2115eab6337853f35",
  measurementId: "G-G86K42XCE4"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const rosterTableBody = document.getElementById('rosterTableBody');

const attendanceQuery = query(
  collection(db, "attendance"),
  orderBy("timestamp", "desc")
);

// Store every student's countdown
const countdowns = new Map();

function formatTime(milliseconds) {

  if (milliseconds <= 0) {
    return "Time Expired";
  }

  const totalSeconds = Math.floor(milliseconds / 1000);

  const hours = Math.floor(totalSeconds / 3600);
  const minutes = Math.floor((totalSeconds % 3600) / 60);
  const seconds = totalSeconds % 60;

  return `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
}

function updateCountdowns() {

  const now = Date.now();

  countdowns.forEach((endTime, element) => {

    const remaining = endTime - now;

    element.textContent = formatTime(remaining);

    if (remaining <= 0) {
      element.classList.add("expired");
    } else {
      element.classList.remove("expired");
    }

  });
}

// Update every second
setInterval(updateCountdowns, 1000);

onSnapshot(
  attendanceQuery,
  (snapshot) => {

    rosterTableBody.innerHTML = '';

    countdowns.clear();

    if (snapshot.empty) {

      rosterTableBody.innerHTML = `
        <tr>
          <td colspan="5" class="empty-state">
            No attendance records found yet.
          </td>
        </tr>
      `;

      return;
    }

    snapshot.forEach((docSnapshot) => {

      const data = docSnapshot.data();

      const row = document.createElement('tr');

      const countdownCell = document.createElement('td');

      countdownCell.className = "countdown";

      if (data.timestamp) {

        const signInTime = data.timestamp.toDate().getTime();

        // 2 hours = 2 × 60 × 60 × 1000 milliseconds
        const endTime = signInTime + (2 * 60 * 60 * 1000);

        countdowns.set(countdownCell, endTime);

        countdownCell.textContent = formatTime(endTime - Date.now());

      } else {

        countdownCell.textContent = "Starting...";

      }

      row.innerHTML = `
        <td><strong>${data.idCode || 'N/A'}</strong></td>
        <td>${data.name || 'Unknown'}</td>
        <td>${data.timeString || '—'}</td>
        <td>${data.dateString || '—'}</td>
      `;

      row.appendChild(countdownCell);

      rosterTableBody.appendChild(row);

    });

    updateCountdowns();

  },
  (error) => {

    console.error("Error loading attendance records:", error);

    rosterTableBody.innerHTML = `
      <tr>
        <td colspan="5" class="empty-state error-text">
          Failed to load records. Check database connection.
        </td>
      </tr>
    `;

  }
);
</script>
</body>
</html>
