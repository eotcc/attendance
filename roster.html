<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin - Monthly Days Attendance</title>
  <link rel="stylesheet" href="roster.css" />
  <style>
    /* Specific styles for days attendance layout */
    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .search-input {
      flex: 1;
      min-width: 220px;
      padding: 10px 14px;
      border-radius: 6px;
      border: 1px solid #334155;
      background-color: #1e293b;
      color: #ffffff;
      font-size: 0.95rem;
      outline: none;
    }
    .search-input:focus {
      border-color: #38bdf8;
    }
    .student-card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 18px;
      margin-bottom: 16px;
    }
    .student-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 10px;
      border-bottom: 1px solid #334155;
      margin-bottom: 14px;
    }
    .student-name {
      font-size: 1.15rem;
      font-weight: bold;
      color: #ffffff;
    }
    .student-id {
      color: #38bdf8;
      font-size: 0.9rem;
      font-weight: 600;
    }
    .month-row {
      margin-top: 12px;
    }
    .month-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .month-label {
      font-weight: 600;
      color: #cbd5e1;
      font-size: 0.95rem;
    }
    .badge-count {
      background-color: #0284c7;
      color: #ffffff;
      font-size: 0.8rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 12px;
    }
    .dates-container {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .date-tag {
      background-color: #0f172a;
      border: 1px solid #334155;
      color: #94a3b8;
      font-size: 0.8rem;
      padding: 4px 10px;
      border-radius: 6px;
    }
  </style>
</head>
<body>

  <div class="roster-container">
    <div class="roster-card">
      
      <!-- Header with Navigation back to Roster -->
      <div class="roster-header">
        <h2>Monthly Days Attended</h2>
        <button onclick="window.location.href='roster.html'">
          ← Back to Live Roster
        </button>
      </div>

      <!-- Search Toolbar -->
      <div class="toolbar">
        <input 
          type="text" 
          id="searchInput" 
          class="search-input" 
          placeholder="Search by Name or Student ID..." 
          autocomplete="off"
        />
      </div>

      <!-- Container for Student Monthly Summary Cards -->
      <div id="cardsContainer">
        <div class="empty-state">Loading attendance totals...</div>
      </div>

    </div>
  </div>

  <!-- Firebase Modular Web SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, 
      collection, 
      query, 
      orderBy, 
      onSnapshot 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Your exact Firebase Configuration from roster.html
    const firebaseConfig = {
      apiKey: "AIzaSyD5DlfgTwgbohbj4fpqQdXzuox63P6GJQA",
      authDomain: "saturdaychurchschool.firebaseapp.com",
      projectId: "saturdaychurchschool",
      storageBucket: "saturdaychurchschool.firebasestorage.app",
      messagingSenderId: "1098070001648",
      appId: "1:1098070001648:web:3c27a2115eab6337853f35",
      measurementId: "G-G86K42XCE4"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const cardsContainer = document.getElementById('cardsContainer');
    const searchInput = document.getElementById('searchInput');

    let allDocs = [];

    // Query 'attendance' collection ordered by timestamp
    const attendanceQuery = query(collection(db, "attendance"), orderBy("timestamp", "desc"));

    // Listen for live updates
    onSnapshot(attendanceQuery, (snapshot) => {
      allDocs = [];
      snapshot.forEach((doc) => {
        allDocs.push(doc.data());
      });
      renderCards();
    }, (error) => {
      console.error("Error loading records:", error);
      cardsContainer.innerHTML = `<div class="empty-state" style="color: #f87171;">Failed to load attendance records.</div>`;
    });

    function processAttendance(searchTerm = "") {
      const grouped = {};

      allDocs.forEach((data) => {
        const idCode = data.idCode || "UNKNOWN";
        const name = data.name || "Student";
        const dateStr = data.dateString || "";

        // Filter match check
        const matchesSearch = 
          idCode.toLowerCase().includes(searchTerm.toLowerCase()) ||
          name.toLowerCase().includes(searchTerm.toLowerCase());

        if (!matchesSearch) return;

        // Determine month key (e.g. "August 2026")
        let parsedDate = new Date(dateStr);
        if (isNaN(parsedDate.getTime()) && data.timestamp) {
          parsedDate = data.timestamp.toDate();
        }

        const monthName = parsedDate.toLocaleString("default", {
          month: "long",
          year: "numeric"
        });

        const dayFormatted = parsedDate.toLocaleDateString();

        if (!grouped[idCode]) {
          grouped[idCode] = {
            name: name,
            months: {}
          };
        }

        if (!grouped[idCode].months[monthName]) {
          grouped[idCode].months[monthName] = new Set();
        }

        if (dayFormatted && dayFormatted !== "Invalid Date") {
          grouped[idCode].months[monthName].add(dayFormatted);
        }
      });

      return grouped;
    }

    function renderCards() {
      const filterTerm = searchInput.value.trim();
      const groupedData = processAttendance(filterTerm);
      cardsContainer.innerHTML = '';

      const studentIds = Object.keys(groupedData);

      if (studentIds.length === 0) {
        cardsContainer.innerHTML = `<div class="empty-state">No student attendance records found.</div>`;
        return;
      }

      studentIds.forEach((idCode) => {
        const student = groupedData[idCode];
        const card = document.createElement('div');
        card.className = 'student-card';

        let monthsHtml = '';

        for (const [monthName, datesSet] of Object.entries(student.months)) {
          const uniqueDates = Array.from(datesSet);
          const dateChips = uniqueDates
            .map((d) => `<span class="date-tag">${d}</span>`)
            .join('');

          monthsHtml += `
            <div class="month-row">
              <div class="month-meta">
                <span class="month-label">${monthName}</span>
                <span class="badge-count">${uniqueDates.length} Day(s)</span>
              </div>
              <div class="dates-container">
                ${dateChips}
              </div>
            </div>
          `;
        }

        card.innerHTML = `
          <div class="student-head">
            <span class="student-name">${student.name}</span>
            <span class="student-id">ID: ${idCode}</span>
          </div>
          ${monthsHtml}
        `;

        cardsContainer.appendChild(card);
      });
    }

    // Live search listener
    searchInput.addEventListener('input', renderCards);
  </script>
</body>
</html>
