<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Nardos Tutoring</title>

<link rel="stylesheet" href="Admin.css">


</head>

<body>
<!-- Admin Login Form -->
<div id="adminLogin">
    <h2>Admin Sign In</h2>

    <form id="adminLoginForm">
        <input
            type="email"
            id="adminEmail"
            placeholder="Admin Email"
            required
        >

        <input
            type="password"
            id="adminPassword"
            placeholder="Password"
            required
        >

        <button type="submit">Sign In</button>

        <p id="loginMessage" role="alert"></p>
    </form>
</div>
<div class="container">
    <h1>Nardos Tutoring</h1>

    <div class="button-container">
        <button onclick="location.href='register.html'">
            Register Students
        </button>

        <button onclick="location.href='students.html'">
            View Students
        </button>

        <button onclick="location.href='attendance.html'">
            Attendance
        </button>

        <button onclick="location.href='homework.html'">
            Homework
        </button>
    </div>
</div>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";
const firebaseConfig = {
  apiKey: "AIzaSyD5DlfgTwgbohbj4fpqQdXzuox63P6GJQA",
  authDomain: "saturdaychurchschool.firebaseapp.com",
  projectId: "saturdaychurchschool",
  storageBucket: "saturdaychurchschool.firebasestorage.app",
  messagingSenderId: "1098070001648",
  appId: "1:1098070001648:web:ce1e14aea3c7a374853f35",
  measurementId: "G-QGES69P8QR"
};
        const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
        // Admin login
const loginForm = document.getElementById("adminLoginForm");
const loginMessage = document.getElementById("loginMessage");
const adminLogin = document.getElementById("adminLogin");
const adminDashboard = document.querySelector(".container");

// Check whether an admin is signed in
onAuthStateChanged(auth, (user) => {
    if (user) {
        adminLogin.style.display = "none";
        adminDashboard.style.display = "block";
    } else {
        adminLogin.style.display = "block";
        adminDashboard.style.display = "none";
    }
});

// Sign in using Firebase Authentication
loginForm.addEventListener("submit", async (event) => {
    event.preventDefault();

    const email = document.getElementById("adminEmail").value.trim();
    const password = document.getElementById("adminPassword").value;

    loginMessage.textContent = "Signing in...";

    try {
        await signInWithEmailAndPassword(auth, email, password);
        loginMessage.textContent = "";
    } catch (error) {
        loginMessage.textContent =
            "Sign-in failed. Check your email and password.";
        console.error("Admin sign-in error:", error);
    }
});
    </script>
</body>
</html>
