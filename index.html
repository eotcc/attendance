<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Sign In Station</title>
  <link rel="stylesheet" href="main.css" />
</head>
<body>

  <div class="auth-container">
    <div class="auth-card" id="signInCard">
      <div class="card-header text-center">
        <h2>Student Sign In</h2>
        <p>Enter your Student ID Code to verify registration.</p>
      </div>

      <form class="auth-form" id="signInForm">
        <div class="form-group">
          <label for="student-id">Student ID Code</label>
          <input 
            type="text" 
            id="student-id" 
            placeholder="e.g. STU-8921" 
            autocomplete="off"
            required 
            autofocus
          />
        </div>

        <button type="submit" class="btn btn-primary" id="submitBtn">Sign In</button>
      </form>

      <div id="statusMessage" class="status-message hidden"></div>
    </div>
  </div>

  <!-- Firebase Modular Web SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Your Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyD5DlfgTwgbohbj4fpqQdXzuox63P6GJQA",
      authDomain: "saturdaychurchschool.firebaseapp.com",
      projectId: "saturdaychurchschool",
      storageBucket: "saturdaychurchschool.firebasestorage.app",
      messagingSenderId: "1098070001648",
      appId: "1:1098070001648:web:3c27a2115eab6337853f35",
      measurementId: "G-G86K42XCE4"
    };

    // Initialize Firebase & Firestore
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // DOM Elements
    const signInForm = document.getElementById('signInForm');
    const studentIdInput = document.getElementById('student-id');
    const statusMessage = document.getElementById('statusMessage');
    const submitBtn = document.getElementById('submitBtn');

    // Handle Form Submit and Firebase Verification
    signInForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const idCode = studentIdInput.value.trim().toUpperCase();

      if (!idCode) return;

      // Show loading state
      submitBtn.disabled = true;
      submitBtn.textContent = 'Verifying ID...';

      try {
        // Query Firestore: Look up document matching ID code in 'students' collection
        const studentDocRef = doc(db, "students", idCode);
        const studentDocSnap = await getDoc(studentDocRef);

        if (!studentDocSnap.exists()) {
          // 🚫 REJECT: ID Code NOT found in Firestore
          showMessage(`❌ ID Code "${idCode}" is not registered on the school roster. Access denied.`, 'error');
          signInForm.reset();
          return;
        }

        // ✅ REGISTERED: Extract the student's name field from the database
        const studentData = studentDocSnap.data();
        const studentName = studentData.name || "Student";

        // Check if student is already signed in on active session roster
        let activeStudents = JSON.parse(localStorage.getItem('activeStudents')) || [];
        const alreadySignedIn = activeStudents.some(s => s.idCode === idCode);

        if (alreadySignedIn) {
          showMessage(`⚠️ Welcome back ${studentName}! You are already signed in.`, 'error');
        } else {
          // Add student to local roster with verified name
          activeStudents.unshift({
            idCode: idCode,
            name: studentName,
            time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
          });
          
          localStorage.setItem('activeStudents', JSON.stringify(activeStudents));
          
          // Display personalized welcome message using database name
          showMessage(`✓ Welcome, ${studentName}! Signed in successfully.`, 'success');
          signInForm.reset();
        }

      } catch (error) {
        console.error("Database lookup failed:", error);
        showMessage("Error reaching database. Check your internet connection.", "error");
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign In';
        studentIdInput.focus();
      }
    });

    function showMessage(msg, type) {
      statusMessage.textContent = msg;
      statusMessage.className = `status-message ${type}`;
    }
  </script>
</body>
</html>
