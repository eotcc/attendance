<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Sign In Station</title>
  <link rel="stylesheet" href="roster.css" />
  <style>
    .admin-link-container {
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.15);
      text-align: center;
    }

    .btn-secondary {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #94a3b8;
      font-size: 0.85rem;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.5);
    }
  </style>
</head>
<body>

  <div class="auth-container">
    <div class="auth-card" id="signInCard">
      <div class="card-header text-center">
        <h2>Student Sign In</h2>
        <p>Enter your Student ID Code to verify registration.</p>
      </div>

      <form class="auth-form" id="signInForm">
        <div class="form-group">
          <label for="student-id">Student ID Code</label>
          <input 
            type="text" 
            id="student-id" 
            placeholder="e.g. STU-8921" 
            autocomplete="off"
            required 
            autofocus
          />
        </div>

        <button type="submit" class="btn btn-primary" id="submitBtn">Sign In</button>
      </form>

      <div id="statusMessage" class="status-message hidden"></div>

      <!-- Password Protected Roster Button -->
      <div class="admin-link-container">
        <button type="button" class="btn-secondary" id="rosterBtn">🔒 View Admin Roster</button>
      </div>
    </div>
  </div>

  <!-- Firebase Modular Web SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, 
      doc, 
      getDoc, 
      collection, 
      addDoc, 
      serverTimestamp 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Your Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyD5DlfgTwgbohbj4fpqQdXzuox63P6GJQA",
      authDomain: "saturdaychurchschool.firebaseapp.com",
      projectId: "saturdaychurchschool",
      storageBucket: "saturdaychurchschool.firebasestorage.app",
      messagingSenderId: "1098070001648",
      appId: "1:1098070001648:web:3c27a2115eab6337853f35",
      measurementId: "G-G86K42XCE4"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // DOM Elements
    const signInForm = document.getElementById('signInForm');
    const studentIdInput = document.getElementById('student-id');
    const statusMessage = document.getElementById('statusMessage');
    const submitBtn = document.getElementById('submitBtn');
    const rosterBtn = document.getElementById('rosterBtn');

    // Password setup for Admin Access
    const ADMIN_PASSWORD = "admin123"; // 🔑 Change this to your preferred password

    rosterBtn.addEventListener('click', () => {
      const inputPass = prompt("Enter Admin Password to access Roster:");
      if (inputPass === ADMIN_PASSWORD) {
        window.location.href = "roster.html";
      } else if (inputPass !== null) {
        alert("Incorrect Password!");
      }
    });

    // Handle Form Submit and Firebase Verification
    signInForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const idCode = studentIdInput.value.trim().toUpperCase();

      if (!idCode) return;

      submitBtn.disabled = true;
      submitBtn.textContent = 'Verifying ID...';

      try {
        const studentDocRef = doc(db, "students", idCode);
        const studentDocSnap = await getDoc(studentDocRef);

        if (!studentDocSnap.exists()) {
          showMessage(`❌ ID Code "${idCode}" is not registered on the school roster. Access denied.`, 'error');
          signInForm.reset();
          return;
        }

        const studentData = studentDocSnap.data();
        const studentName = studentData.name || "Student";

        const now = new Date();
        const currentTime = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        const currentDate = now.toLocaleDateString();

        // Record entry into 'attendance' collection
        await addDoc(collection(db, "attendance"), {
          idCode: idCode,
          name: studentName,
          timeString: currentTime,
          dateString: currentDate,
          timestamp: serverTimestamp()
        });

        showMessage(`✓ Welcome, ${studentName}! Signed in at ${currentTime}.`, 'success');
        signInForm.reset();

      } catch (error) {
        console.error("Database lookup or write failed:", error);
        showMessage("Error reaching database. Check your internet connection.", "error");
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign In';
        studentIdInput.focus();
      }
    });

    function showMessage(msg, type) {
      statusMessage.textContent = msg;
      statusMessage.className = `status-message ${type}`;
    }
  </script>
</body>
</html>
