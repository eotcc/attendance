<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Student Sign In Station</title>

  <link rel="stylesheet" href="main.css">

  <style>
    .admin-link-container {
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.15);
      text-align: center;
    }

    .btn-secondary {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #94a3b8;
      font-size: 0.85rem;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.5);
    }
  </style>
</head>

<body>

  <!-- Payment Button -->
  <button type="button" class="pay-button" onclick="openPayment()">
    Pay
  </button>

  <!-- Payment Popup -->
  <div id="paymentContainer" class="payment-container">
    <div class="payment-frame-box">
      <button
        type="button"
        class="close-payment"
        onclick="closePayment()"
        aria-label="Close payment"
      >×</button>

      <iframe
        src="pay.html"
        class="payment-frame"
        title="Payment"
      ></iframe>
    </div>
  </div>

  <script>
    function openPayment() {
      document.getElementById("paymentContainer").style.display = "flex";
    }

    function closePayment() {
      document.getElementById("paymentContainer").style.display = "none";
    }
  </script>

  <!-- School Logo -->
  <div class="card-header text-center">
    <img src="logo.jpg" alt="Nardos Tutoring" class="company-logo">
    <h1 class="company-name">አስጠኚ</h1>
  </div>

  <!-- Student Sign-In Card -->
  <div class="auth-container">
    <div class="auth-card" id="signInCard">

      <h2>Student Sign In</h2>

      <div class="card-header text-center"></div>

      <form class="auth-form" id="signInForm">

        <div class="form-group">
          <label for="student-id">Student ID Code</label>

          <input
            type="text"
            id="student-id"
            placeholder="e.g. STU-8921"
            autocomplete="off"
            required
            autofocus
          >
        </div>

        <button
          type="submit"
          class="btn btn-primary"
          id="submitBtn"
        >
          Submit
        </button>

      </form>

      <div
        id="statusMessage"
        class="status-message hidden"
        role="status"
        aria-live="polite"
      ></div>

      <!-- Admin Sign-In Link -->
      <div class="admin-link-container">
        <button
          type="button"
          class="btn-secondary"
          id="rosterBtn"
        >
          🔒 Sign In
        </button>
      </div>

    </div>
  </div>

  <!-- Firebase Student Attendance -->
  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";

    import {
      getFirestore,
      doc,
      getDoc,
      collection,
      addDoc,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyD5DlfgTwgbohbj4fpqQdXzuox63P6GJQA",
      authDomain: "saturdaychurchschool.firebaseapp.com",
      projectId: "saturdaychurchschool",
      storageBucket: "saturdaychurchschool.firebasestorage.app",
      messagingSenderId: "1098070001648",
      appId: "1:1098070001648:web:3c27a2115eab6337853f35",
      measurementId: "G-G86K42XCE4"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Page Elements
    const signInForm = document.getElementById("signInForm");
    const studentIdInput = document.getElementById("student-id");
    const statusMessage = document.getElementById("statusMessage");
    const submitBtn = document.getElementById("submitBtn");
    const rosterBtn = document.getElementById("rosterBtn");

    // Open the Admin Login Page
    // No hardcoded admin password is used here.
    rosterBtn.addEventListener("click", () => {
      window.location.href = "Admin.html";
    });

    // Student Attendance Submission
    signInForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      const idCode = studentIdInput.value.trim().toUpperCase();

      if (!idCode) {
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "Verifying ID...";

      try {

        // Look up the student in Firestore
        const studentDocRef = doc(db, "students", idCode);
        const studentDocSnap = await getDoc(studentDocRef);

        console.log("Entered code:", idCode);
        console.log("Document path:", studentDocRef.path);
        console.log("Document exists:", studentDocSnap.exists());

        // Reject unregistered student codes
        if (!studentDocSnap.exists()) {

          showMessage(
            `❌ ID Code "${idCode}" is not registered on the school roster. Access denied.`,
            "error"
          );

          signInForm.reset();
          return;
        }

        const studentData = studentDocSnap.data();
        const studentName = studentData.name || "Student";

        // Current date and time
        const now = new Date();

        const currentTime = now.toLocaleTimeString([], {
          hour: "2-digit",
          minute: "2-digit"
        });

        const currentDate = now.toLocaleDateString();

        // Record student attendance
        await addDoc(collection(db, "attendance"), {
          idCode: idCode,
          name: studentName,
          timeString: currentTime,
          dateString: currentDate,
          timestamp: serverTimestamp()
        });

        showMessage(
          `✓ Welcome, ${studentName}! Signed in at ${currentTime}.`,
          "success"
        );

        signInForm.reset();

      } catch (error) {

        console.error("Database lookup or write failed:", error);

        showMessage(
          `Database error: ${error.code || "unknown"} — ${error.message || error}`,
          "error"
        );

      } finally {

        submitBtn.disabled = false;
        submitBtn.textContent = "Submit";
        studentIdInput.focus();

      }
    });

    // Display Attendance Messages
    function showMessage(message, type) {
      statusMessage.textContent = message;
      statusMessage.className = `status-message ${type}`;
    }

  </script>

  <!-- Student Registration -->
  <a href="register.html" class="registration-button">
    Student Registration
  </a>

</body>
</html>
